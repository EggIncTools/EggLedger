name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            asset: EggLedger-linux.tar.gz
            kind: targz
          - rid: osx-x64
            os: macos-15
            asset: EggLedger-mac.zip
            kind: zip
          - rid: osx-arm64
            os: macos-15
            asset: EggLedger-mac-arm64.zip
            kind: zip
          - rid: win-x64
            os: windows-latest
            asset: EggLedger.exe
            kind: rawexe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        shell: bash
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ github.token }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Publish
        shell: bash
        run: |
          dotnet publish EggLedger.Desktop/EggLedger.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -o publish/${{ matrix.rid }}

      - name: Check signing prerequisites
        id: signing
        if: matrix.kind == 'rawexe'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Hide nuget.config for signing
        if: matrix.kind == 'rawexe' && steps.signing.outputs.available == 'true'
        shell: bash
        run: mv nuget.config nuget.config.bak

      - name: Sign Windows executable
        if: matrix.kind == 'rawexe' && steps.signing.outputs.available == 'true'
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: publish/win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          case "${{ matrix.kind }}" in
            targz) tar -czf "../../${{ matrix.asset }}" . ;;
            zip)   zip -r "../../${{ matrix.asset }}" . ;;
            rawexe) cp EggLedger.exe "../../${{ matrix.asset }}" ;;
          esac

      - name: Hash
        shell: bash
        run: sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: ${{ matrix.asset }}

      - name: Upload checksum line
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sha-${{ matrix.rid }}
          path: ${{ matrix.asset }}.sha256

  checksums:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sha-*
          merge-multiple: true
          path: sums
      - run: cat sums/*.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: SHA256SUMS

  docker:
    uses: EggIncTools/EggIdentity/.github/workflows/docker-publish.yml@main
    with:
      needs-pat: true
      version-build-arg: EGGLEDGER_VERSION
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
